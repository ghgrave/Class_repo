<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>DoggyHorse</title>
    </head>
    <body>
        <h1>My First Form</h1>
        <form action="/login/more/and/more/12345" method="post">
            <label>First Name:
                <input
                        type="text"
                        name="first_name"
                        id="doggy"
                        required
                        maxlength="5"
                >
            </label>
            <br>
            <label>Last Name:
                <input
                        type="text"
                        name="last_name"
                        id="kitty"
                >
            </label>
            <br>
            <label>Age:
                <input
                        type="number"
                        name="age"
                        id="birdy"
                        min="21"
                        max="99"
                >

            </label>
            <button type="submit">SUBMIT</button>
        </form>
    </body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grid Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
<!--    create a row-->
    <div class="row">
        <div class="col-3 col-lg-4 col-sm-12" style="height: 100px; background-color: red;">
<!--            inside rows!-->
        </div>
        <div class="col-7 col-lg-4 col-sm-12" style="height: 100px; background-color: green;"></div>
        <div class="col-2 col-lg-4 col-sm-12" style="height: 100px; background-color: red;"></div>
    </div>
    <!--    create a row2-->
    <div class="row">
        <div class="col-3" style="height: 100px; background-color: green;"></div>
        <div class="col-7" style="height: 100px; background-color: red;"></div>
        <div class="col-2" style="height: 100px; background-color: green;"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
